[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-netview"
version = "0.1.0"
description = "Incremental DNS telemetry with transactional SQLite rollups"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Derek Poe"}]
dependencies = []
readme = "README.md"

[project.scripts]
aurora-netview = "aurora_netview.__main__:main"

[tool.setuptools.packages.find]
include = ["aurora_netview*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/run.py" = ["E402"]
"checks/randomized.py" = ["E402"]
